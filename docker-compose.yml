services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nps-portal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NPS_BASE_URL=${NPS_BASE_URL}
      - NPS_AUTH_KEY=${NPS_AUTH_KEY}
      - NPS_PUBLIC_HOST=${NPS_PUBLIC_HOST}
      - NPS_PUBLIC_HOSTS=${NPS_PUBLIC_HOSTS:-${NPS_PUBLIC_HOST}}
      - DEFAULT_NPS_CLIENT_ID=${DEFAULT_NPS_CLIENT_ID:-0}
      - PORTAL_USERNAME=${PORTAL_USERNAME}
      - PORTAL_PASSWORD=${PORTAL_PASSWORD}
      - ALLOWED_REMARK_PREFIX=${ALLOWED_REMARK_PREFIX}
      - MASK_CLIENT_IP=${MASK_CLIENT_IP}
      - JWT_SECRET=${JWT_SECRET}
      - DATA_DIR=/app/data
      - DEFAULT_TUNNEL_TTL_MINUTES=${DEFAULT_TUNNEL_TTL_MINUTES:-1440}
      - MAX_TUNNEL_TTL_MINUTES=${MAX_TUNNEL_TTL_MINUTES:-43200}
      - ENABLE_CUSTOM_TARGET_PORT=${ENABLE_CUSTOM_TARGET_PORT:-false}
      - DEFAULT_SSH_USER=${DEFAULT_SSH_USER:-ant}
      - CLEANUP_INTERVAL_SECONDS=${CLEANUP_INTERVAL_SECONDS:-60}
      - USER_TTL_MIN_MINUTES=${USER_TTL_MIN_MINUTES:-5}
      - USER_TTL_MAX_MINUTES=${USER_TTL_MAX_MINUTES:-1440}
      - USER_TTL_DEFAULT_MINUTES=${USER_TTL_DEFAULT_MINUTES:-720}
      - AUTO_PORT_START=${AUTO_PORT_START:-1}
      - AUTO_PORT_END=${AUTO_PORT_END:-65535}
      - AUTO_PORT_BLOCKLIST=${AUTO_PORT_BLOCKLIST:-8080,8088,18000,18022}
      - AUTO_PORT_SOCKET_CHECK=${AUTO_PORT_SOCKET_CHECK:-false}
      - ALLOW_CUSTOM_TARGET_HOST=${ALLOW_CUSTOM_TARGET_HOST:-true}
      - TARGET_HOST_WHITELIST=${TARGET_HOST_WHITELIST:-127.0.0.1,localhost}
      - MAX_RUNNING_MAPPINGS_PER_USER=${MAX_RUNNING_MAPPINGS_PER_USER:-3}
      - MAX_RUNNING_MAPPINGS_TOTAL=${MAX_RUNNING_MAPPINGS_TOTAL:-200}
      - SSH_PORT_START=${SSH_PORT_START:-18023}
      - SSH_PORT_END=${SSH_PORT_END:-18522}
      - WEB_PORT_START=${WEB_PORT_START:-18523}
      - WEB_PORT_END=${WEB_PORT_END:-19022}
      - GDB_PORT_START=${GDB_PORT_START:-19023}
      - GDB_PORT_END=${GDB_PORT_END:-19522}
      - TEMP_PORT_START=${TEMP_PORT_START:-19523}
      - TEMP_PORT_END=${TEMP_PORT_END:-20022}
    volumes:
      - portal-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nps-portal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nps-portal-frontend
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8088}:80"
    depends_on:
      - backend
    networks:
      - nps-portal

networks:
  nps-portal:
    driver: bridge

volumes:
  portal-data: